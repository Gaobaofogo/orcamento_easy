services:
  # Serviço de Banco de Dados Relacional (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: marcenaria_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

# Serviço do SeaweedFS
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: marcenaria_storage
    command: >
      server
      -dir=/data
      -s3
      -s3.port=9000
      -filer
    ports:
      - "9001:8888" # Mapeia a porta 9001 do seu navegador para a interface web do Filer (8888)
      - "9000:9000" # Porta de API do S3 (para o FastAPI backend usar)
      - "9333:9333" # (Opcional) Porta do Master Server
    environment:
      - SEAWEEDFS_S3_ALLOW_EMPTY_FOLDER=true
    volumes:
      - ./storage_seaweed_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Serviço do SeaweedFS (Substituindo o MinIO)

  # Utilitário para criar o bucket no SeaweedFS via CLI S3 oficial da AWS
  createbuckets:
    image: amazon/aws-cli:latest
    container_name: marcenaria_createbuckets
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c '
      aws --endpoint-url http://storage:9000 s3 mb s3://marcenaria-uploads || true;
      exit 0;
      '

  ##### PRODUCTION #####
  # Serviço Backend (FastAPI Python)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      target: "prod"
    profiles: ["prod"]
    container_name: marcenaria_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=prod
      - JWT_SECRET=${BACKEND_JWT_SECRET}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - MINIO_ENDPOINT=storage:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=marcenaria-uploads
      - LOCAL_STORAGE_DIR=/app/uploads
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - backend_uploads:/app/uploads
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: "prod"
    profiles: ["prod"]
    container_name: marcenaria_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
  ##### END PRODUCTION #####

  ##### DEVELOPMENT #####
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      target: "dev"
    profiles: ["dev"]
    container_name: marcenaria_backend_dev
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=dev
      - JWT_SECRET=${BACKEND_JWT_SECRET}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - MINIO_ENDPOINT=storage:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=marcenaria-uploads
      - LOCAL_STORAGE_DIR=/app/uploads
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - backend_uploads:/app/uploads
      - ./backend:/app

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: "dev"
    profiles: ["dev"]
    container_name: marcenaria_frontend_dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://backend-dev:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-dev
  ##### END DEVELOPMENT #####

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local